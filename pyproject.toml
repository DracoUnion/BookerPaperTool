[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BookerPaperTool"
version = "2026.10.29.0"
description = "iBooker/DracoUnion 论文与素材处理大模型 Agent 工具"
readme = "README.md"
license = {text = "SATA"}
authors = [
    {name = "wizardforcel", email = "wizard.z@qq.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
keywords = ["paper", "textbook", "论文", "教科书", "agent", "llm"]
requires-python = ">=3.8"
dependencies = [
    "openai",
    "httpx",
    "requests",
    "pyyaml",
    "pydantic",
    "json_repair",
    "pymupdf",
    "pillow",
    "pyturndown",
    "ctx-compact",
]

[project.urls]
Homepage = "https://github.com/DracoUnion/BookerPaperTool"

[project.scripts]
BookerPaperTool = "BookerPaperTool.__main__:main"
paper-tool = "BookerPaperTool.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["BookerPaperTool*"]

[tool.setuptools.package-data]
"*" = ["*"]
